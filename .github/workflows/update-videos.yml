name: Update video list

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_videos.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/videos.json; then
            echo "No new videos."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
            git add data/videos.json
            git commit -m "Update video list"
            git push
          fi
