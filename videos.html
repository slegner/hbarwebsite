<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videos · H-bar</title>
  <meta name="description" content="Every H-bar Talk Science episode, in English and Chinese.">
  <link rel="icon" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/lang.js"></script>
</head>
<body data-page="videos">
  <header class="nav"></header>

  <main>
    <section class="page-hero">
      <p class="eyebrow">
        <span data-l="en">On tap</span>
        <span data-l="zh-Hans">今日特调</span>
        <span data-l="zh-Hant">今日特調</span>
      </p>
      <h1>
        <span data-l="en">Videos</span>
        <span data-l="zh-Hans">视频</span>
        <span data-l="zh-Hant">影片</span>
      </h1>
      <p class="lede">
        <span data-l="en">Every episode, in English and Chinese. Pick a drink.</span>
        <span data-l="zh-Hans">每一集都在这里，中英双语。挑一杯吧。</span>
        <span data-l="zh-Hant">每一集都在這裡，中英雙語。挑一杯吧。</span>
      </p>
    </section>

    <section class="section">
      <div class="section-head">
        <div class="filters">
          <button type="button" class="chip active" data-video-filter="all">
            <span data-l="en">All</span>
            <span data-l="zh-Hans">全部</span>
            <span data-l="zh-Hant">全部</span>
          </button>
          <button type="button" class="chip" data-video-filter="en">English</button>
          <button type="button" class="chip" data-video-filter="zh">中文</button>
        </div>
        <a class="link-arrow" href="https://www.youtube.com/@H-bartalkScienceH" target="_blank" rel="noopener">
          <span data-l="en">Open on YouTube →</span>
          <span data-l="zh-Hans">在 YouTube 上观看 →</span>
          <span data-l="zh-Hant">在 YouTube 上觀看 →</span>
        </a>
      </div>
      <div class="grid" data-videos></div>
      <div class="more-wrap">
        <button id="load-more" class="btn" type="button">
          <span data-l="en">Pour another round</span>
          <span data-l="zh-Hans">再来一轮</span>
          <span data-l="zh-Hant">再來一輪</span>
        </button>
      </div>
    </section>
  </main>

  <footer class="footer"></footer>

  <dialog id="player" aria-label="Video player">
    <button class="close" type="button" aria-label="Close">×</button>
    <div class="frame"></div>
  </dialog>

  <script src="assets/site.js"></script>
  <script src="assets/videos.js"></script>
</body>
</html>
