<path transform="matrix(1,0,0,-1,0,345.78965)" stroke-width=".8" stroke-linecap="square" stroke-miterlimit="10" stroke-linejoin="miter" fill="none" stroke="#000000" d="M38.506879 168.09636H164.05689"/>
<path transform="matrix(1,0,0,-1,0,345.78965)" stroke-width=".8" stroke-linecap="square" stroke-miterlimit="10" stroke-linejoin="miter" fill="none" stroke="#000000" d="M38.506879 292.83638H164.05689"/>
</g></defs></svg>
<div class="app">
  <aside>
    <h2>Figure</h2>
    <select id="page"></select>
    <h2 id="panelhead">Panel</h2>
    <div id="picker"></div>
    <div class="thumbs" id="thumbs"></div>
    <h2>Datasets</h2>
    <div id="datasets"></div>
  </aside>
  <main>
    <div class="bar">
      <div><span class="label" id="label"></span></div>
      <div class="row" style="margin:0">
        <span class="hint" id="hint">← → switch panel</span>
        <button id="dl">Download SVG</button>
      </div>
    </div>
    <div class="stage"><svg id="view" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </main>
</div>
<script>
const META = [{"page": 1, "width": 296.806884765625, "height": 345.7896423339844, "method": "vector", "panels": [{"name": "\u03a9m", "view": [2.65, 0.0, 231.85, 181.69], "masks": [[38.51, 177.69, 125.55, 4.0], [164.06, 177.69, 70.44, 4.0]], "pads": [3.0, 3.0, 3.0, 0.6], "axes": [38.51, 52.95, 125.55, 124.74]}, {"name": "H0 vs \u03a9m", "view": [2.65, 173.69, 165.41, 170.2], "masks": [[164.06, 177.69, 4.0, 124.74], [38.51, 173.69, 125.55, 4.0]], "pads": [3.0, 0.6, 0.6, 3.0], "axes": [38.51, 177.69, 125.55, 124.74]}, {"name": "H0", "view": [160.06, 173.69, 133.55, 170.2], "masks": [[160.06, 177.69, 4.0, 124.74], [160.06, 173.69, 4.0, 4.0]], "pads": [0.6, 3.0, 3.0, 3.0], "axes": [164.06, 177.69, 125.55, 124.74]}], "datasets": [{"id": "p1-d0", "name": "Planck 2018", "colour": "#785ef0", "shades": ["#785ef0", "#a695f5", "#d4ccfa", "#e6e1fc"]}, {"id": "p1-d1", "name": "DESI DR2", "colour": "#fe6100", "shades": ["#fe6100", "#fe9a5c", "#ffcdae", "#ffe4d3"]}, {"id": "p1-d2", "name": "SH0ES (Riess 2020)", "colour": "#648fff", "shades": ["#648fff", "#8aaaff", "#cedbff"]}], "grid": {"n": 2, "params": [{"name": "\u03a9m", "view": [91.41, 326.18, 19.74, 16.71]}, {"name": "H0", "view": [217.71, 326.18, 18.25, 16.71]}], "cells": {"0,0": 0, "1,0": 1, "1,1": 2}, "xaxis": [{"ticks": [[63.6, "0.28"], [113.8, "0.32"]], "label": [91.41, 326.18, 19.74, 16.71]}, {"ticks": [[180.8, "65"], [222.6, "70"], [264.5, "75"]], "label": [217.71, 326.18, 18.25, 16.71]}], "yaxis": [{"ticks": [[177.7, "75"]], "label": [4.65, 106.46, 14.71, 17.74]}, {"ticks": [[202.6, "75"], [244.2, "70"], [285.8, "65"]], "label": [4.65, 231.94, 14.71, 16.25]}]}}];
const NS = "http://www.w3.org/2000/svg";
const hidden = new Set();
let P = META[0], cur = -1;  // cur = -1 means whole page
let selA = null, selB = null;  // chosen parameters (corner plots)

const $ = id => document.getElementById(id);

function viewOf(i) {
  return i < 0 ? [0, 0, P.width, P.height] : P.panels[i].view;
}
function masksOf(i) {
  return i < 0 ? [] : P.panels[i].masks;
}
function maskMarkup(i) {
  return masksOf(i).map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff"/>`).join("");
}

// the page clipped to panel i's crop box (otherwise letterboxing reveals neighbouring panels)
let uid = 0;
function viewMarkup(i) {
  const [x, y, w, h] = viewOf(i), id = "cv" + (uid++);
  return `<clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath>` +
         `<g clip-path="url(#${id})"><use href="#page-${P.page}"/>${maskMarkup(i)}</g>`;
}

// corner plots: inner panels carry no tick values, so draw the column's x axis and the row's
// y axis around the chosen panel. Tick values are redrawn as text at a size relative to the
// panel; axis labels are the figure's own glyphs, scaled to match.
const SERIF = "'CMU Serif','Latin Modern Roman','Computer Modern',Georgia,'Times New Roman',serif";
function composed(i) {
  const G = P.grid, [r, c] = cellOf(i), [ax, ay, aw, ah] = P.panels[i].axes;
  const [pl, pt, pr, pb] = P.panels[i].pads;
  const S = Math.min(aw, ah), fs = 0.075 * S, gap = 0.035 * S, Lh = 0.1 * S;
  let x0 = ax - pl, y0 = ay - pt, x1 = ax + aw + pr, y1 = ay + ah + pb;
  const grow = (x, y) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); };
  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  // copy a box of the page, scaled by k, so that its centre lands on (cx, cy)
  const glyphs = (b, k, cx, cy) => {
    const id = "cv" + (uid++), bx = b[0] + b[2] / 2, by = b[1] + b[3] / 2;
    grow(cx - b[2] * k / 2, cy - b[3] * k / 2); grow(cx + b[2] * k / 2, cy + b[3] * k / 2);
    return `<g transform="translate(${cx},${cy}) scale(${k}) translate(${-bx},${-by})">` +
           `<clipPath id="${id}"><rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}"/></clipPath>` +
           `<g clip-path="url(#${id})"><use href="#page-${P.page}"/></g></g>`;
  };
  const id = "cv" + (uid++);
  let m = `<clipPath id="${id}"><rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}"/></clipPath>` +
          `<g clip-path="url(#${id})"><use href="#page-${P.page}"/></g>`;
  let t = `<g font-family="${SERIF}" font-size="${fs}" fill="#000">`;

  const X = G.xaxis[c];
  const ty = ay + ah + pb + gap + fs * 0.8;
  X.ticks.forEach(([x, s]) => { t += `<text x="${x}" y="${ty}" text-anchor="middle">${esc(s)}</text>`; grow(x - s.length * fs * 0.3, ty + fs * 0.2); });
  if (X.label) {
    const k = Lh / X.label[3] * 1.6;  // label boxes carry padding; 1.6 brings glyph height to ~Lh
    m += glyphs(X.label, k, ax + aw / 2, ty + gap + X.label[3] * k / 2);
  }
  if (r !== c) {
    const Y = G.yaxis[r];
    const tx = ax - pl - 1.5 * gap;  // clear of the frame and any outward tick marks
    let wide = 0;
    Y.ticks.forEach(([y, s]) => { t += `<text x="${tx}" y="${y + fs * 0.35}" text-anchor="end">${esc(s)}</text>`; wide = Math.max(wide, s.length * fs * 0.55); grow(tx - s.length * fs * 0.55, y); });
    if (Y.label) {
      const k = Lh / Y.label[2] * 1.6;
      m += glyphs(Y.label, k, tx - wide - gap - Y.label[2] * k / 2, ay + ah / 2);
    }
  }
  m += t + "</g>";
  const pad = 0.04 * S;
  return { view: [x0 - pad, y0 - pad, x1 - x0 + 2 * pad, y1 - y0 + 2 * pad], markup: m };
}

function miniSvg(i) {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", viewOf(i).join(" "));
  s.innerHTML = viewMarkup(i);
  return s;
}

function renderThumbs() {
  const box = $("thumbs"); box.innerHTML = "";
  const items = [{ name: "Whole figure" }, ...P.panels];
  items.forEach((p, k) => {
    const i = k - 1, d = document.createElement("div");
    d.className = "thumb" + (i === cur ? " on" : "");
    d.title = p.name;
    d.appendChild(miniSvg(i));
    const t = document.createElement("small"); t.textContent = p.name; d.appendChild(t);
    d.onclick = () => select(i);
    box.appendChild(d);
  });
}

// corner plots: pick two parameters instead of browsing panel thumbnails
function cellOf(i) {
  for (const [k, v] of Object.entries(P.grid.cells)) if (v === i) return k.split(",").map(Number);
  return null;
}

function renderPicker() {
  const box = $("picker"); box.innerHTML = "";
  const G = P.grid;
  const single = !G && P.panels.length <= 1;  // nothing to choose: just show the figure
  $("panelhead").textContent = G ? "Parameters" : "Panel";
  $("panelhead").style.display = single ? "none" : "";
  $("thumbs").style.display = G || single ? "none" : "";
  if (!G) return;
  [["Parameter A", "A"], ["Parameter B", "B"]].forEach(([title, which]) => {
    const l = document.createElement("div"); l.className = "pick-label"; l.textContent = title;
    const row = document.createElement("div"); row.className = "pick"; row.dataset.which = which;
    G.params.forEach((p, i) => {
      const b = document.createElement("button"); b.className = "chip"; b.title = p.name; b.dataset.i = i;
      if (p.view) {
        const s = document.createElementNS(NS, "svg"), [x, y, w, h] = p.view, id = "lb" + (uid++);
        s.setAttribute("viewBox", p.view.join(" "));
        s.style.aspectRatio = w / h;
        s.innerHTML = `<clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath>` +
                      `<g clip-path="url(#${id})"><use href="#page-${P.page}"/></g>`;
        b.appendChild(s);
      } else b.textContent = p.name;
      b.onclick = () => {
        if (which === "A") selA = selA === i ? null : i; else selB = selB === i ? null : i;
        showSelection();
      };
      row.appendChild(b);
    });
    box.append(l, row);
  });
  const r = document.createElement("div"); r.className = "row";
  const whole = document.createElement("button"); whole.textContent = "Whole figure";
  whole.onclick = () => { selA = selB = null; select(-1); };
  r.appendChild(whole);
  const note = document.createElement("div"); note.className = "note"; note.id = "picknote";
  box.append(r, note);
}

function showSelection() {
  const G = P.grid;
  let a = selA, b = selB;
  if (a === null) [a, b] = [b, null];
  if (a === null) return select(-1);
  if (b === null) b = a;  // one parameter: its 1D distribution
  const i = G.cells[`${Math.max(a, b)},${Math.min(a, b)}`];
  if (i === undefined) { $("picknote").textContent = "That combination isn't plotted in this figure."; return; }
  select(i);
}

function syncChips() {
  if (!P.grid) return;
  // keep the chips in step with the panel shown (it may have been reached with the arrow keys)
  const c = cur < 0 ? null : cellOf(cur);
  if (!c) selA = selB = null;
  else if (c[0] !== c[1]) { selA = c[1]; selB = c[0]; }
  else if (selA !== c[0] && selB !== c[0]) { selA = c[0]; selB = null; }
  document.querySelectorAll(".pick").forEach(row => {
    const sel = row.dataset.which === "A" ? selA : selB;
    row.querySelectorAll(".chip").forEach(ch => ch.classList.toggle("on", +ch.dataset.i === sel));
  });
  $("picknote").textContent = cur < 0 ? "Pick one parameter for its 1D distribution, or two for their contour." : "";
}

function renderDatasets() {
  const box = $("datasets"); box.innerHTML = "";
  if (!P.datasets.length) {
    box.innerHTML = '<div class="empty">No separable coloured datasets on this figure.</div>';
    return;
  }
  P.datasets.forEach(d => {
    const row = document.createElement("div"); row.className = "ds";
    const lab = document.createElement("label");
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !hidden.has(d.id);
    cb.onchange = () => { cb.checked ? hidden.delete(d.id) : hidden.add(d.id); applyHidden(); };
    const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = d.colour;
    if (d.shades.length > 1) sw.style.background = `linear-gradient(135deg, ${d.colour} 50%, ${d.shades.find(s => s !== d.colour)} 50%)`;
    const nm = document.createElement("span"); nm.className = "name"; nm.textContent = d.name;
    lab.append(cb, sw, nm);
    const only = document.createElement("button"); only.textContent = "only";
    only.title = "Show only this dataset";
    only.onclick = () => { P.datasets.forEach(o => o.id === d.id ? hidden.delete(o.id) : hidden.add(o.id)); applyHidden(); renderDatasets(); };
    row.append(lab, only); box.appendChild(row);
  });
  const r = document.createElement("div"); r.className = "row";
  const all = document.createElement("button"); all.textContent = "Show all";
  all.onclick = () => { P.datasets.forEach(o => hidden.delete(o.id)); applyHidden(); renderDatasets(); };
  r.appendChild(all); box.appendChild(r);
}

function applyHidden() {
  $("hide-rules").textContent = [...hidden].map(id => `.${id}{display:none}`).join("\n");
}

function select(i) {
  cur = i;
  if (P.grid && i >= 0) {
    const v = composed(i);
    $("view").setAttribute("viewBox", v.view.join(" "));
    $("view").innerHTML = v.markup;
  } else {
    $("view").setAttribute("viewBox", viewOf(i).join(" "));
    $("view").innerHTML = viewMarkup(i);
  }
  $("label").textContent = i < 0 ? "Whole figure" : P.panels[i].name;
  document.querySelectorAll(".thumb").forEach((t, k) => t.classList.toggle("on", k - 1 === i));
  syncChips();
}

function setPage(k) {
  P = META[k];
  $("page").value = k;
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  $("sub").textContent = `page ${P.page} · ${plural(P.panels.length, "panel")} · ${plural(P.datasets.length, "dataset")}` +
                         (P.method === "raster" ? " · raster figure (panels cut by whitespace)" : "");
  selA = selB = null;
  $("hint").style.display = P.panels.length <= 1 ? "none" : "";
  renderThumbs(); renderPicker(); renderDatasets();
  select(-1);
}

META.forEach((m, k) => {
  const o = document.createElement("option"); o.value = k;
  o.textContent = `Page ${m.page} — ${m.panels.length} panel${m.panels.length === 1 ? "" : "s"}` +
                  (m.datasets.length ? `, ${m.datasets.length} datasets` : "");
  $("page").appendChild(o);
});
$("page").onchange = e => setPage(+e.target.value);

document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (P.panels.length <= 1) return;
  if (e.key === "ArrowRight") select(Math.min(cur + 1, P.panels.length - 1));
  if (e.key === "ArrowLeft") select(Math.max(cur - 1, -1));
});

$("dl").onclick = () => {
  // the view references the page by id, so ship a copy of it (minus hidden datasets) as a def
  const g = document.getElementById("page-" + P.page).cloneNode(true);
  hidden.forEach(id => g.querySelectorAll("." + id).forEach(el => el.remove()));
  const v = $("view").getAttribute("viewBox").split(" ");
  const svg = `<svg xmlns="${NS}" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="${v.join(" ")}" ` +
              `width="${v[2]}" height="${v[3]}"><defs>${g.outerHTML}</defs>${$("view").innerHTML}</svg>`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  const nm = (cur < 0 ? "figure" : P.panels[cur].name).replace(/[^\p{L}\p{N}]+/gu, "-").toLowerCase();
  a.download = `page${P.page}_${nm}.svg`; a.click();
};

setPage(0);
</script>
</body>
</html>
